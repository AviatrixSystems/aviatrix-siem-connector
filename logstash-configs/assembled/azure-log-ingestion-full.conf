# Gateway Network Stats pre-processing for Azure
filter {
    if "gw_net_stats" in [tags] {
        ruby {
            id => "gw-net-stats-azure-timegen"
            # ls_timestamp: ISO-8601 event time, a declared string column in the table
            # Rates are float bytes/s after 95-field-conversion; the table/DCR columns
            # are int (4-table-schemas.tf), so round to whole bytes/s here.
            code => "
                event.set('TimeGenerated', event.get('@timestamp'))
                event.set('ls_timestamp', event.get('@timestamp').to_s)
                ['total_rx_rate', 'total_tx_rate', 'total_rx_tx_rate'].each do |f|
                    v = event.get(f)
                    event.set(f, v.round) if v.is_a?(Float)
                end
            "
        }

        mutate {
            id => "gw-net-stats-azure-cleanup"
            remove_field => ["message", "host", "port", "type", "event", "@version", "syslog_pri"]
        }
    }
}

