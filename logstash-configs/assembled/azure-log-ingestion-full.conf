# Tunnel Status Change Filter
# Parses AviatrixTunnelStatusChange syslog messages (controller, tunnels/db.py).
#
# Two formats:
#   current (8.0.10+, 8.1.10+, 8.2 and later):
#     AviatrixTunnelStatusChange: Gateway <reporter> reported Tunnel
#       <a(Vendor region)intf=eth1,b(Vendor region)intf=eth2 > old_state=Up new_state=Down
#     (intf= is optional on either side; states include Deleted on teardown)
#   legacy (8.0.0, 8.1.0 and older):
#     AviatrixTunnelStatusChange: src_gw=a(Vendor region) [src_intf=X ]dst_gw=b(...) [dst_intf=Y ]
#       old_state=Down new_state=Up
# Both fill src_gw/dst_gw/old_state/new_state; the current format also sets
# reporting_gw. The trailing colon in the gate keeps the controller event-bus
# message "AviatrixTunnelStatusChanged:" (different format) out of this filter.

filter {
    if [type] == "syslog" and "AviatrixTunnelStatusChange:" in [message] {
        grok {
            id => "tunnel_status"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["tunnel_status"]
            tag_on_failure => ["_avx_grok_failure_tunnel_status"]
            break_on_match => true
            match => {
                "message" => [
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixTunnelStatusChange: Gateway %{NOTSPACE:reporting_gw} reported Tunnel <%{TUNNEL_GW:src_gw}(?:intf=(?<src_intf>[^,\s>]+))?,%{TUNNEL_GW:dst_gw}(?:intf=(?<dst_intf>[^,\s>]+))? ?> old_state=%{WORD:old_state} new_state=%{WORD:new_state}",
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixTunnelStatusChange:.*src_gw=%{TUNNEL_GW:src_gw}(?: src_intf=%{NOTSPACE:src_intf})?.*dst_gw=%{TUNNEL_GW:dst_gw}(?: dst_intf=%{NOTSPACE:dst_intf})?.*old_state=%{WORD:old_state}.*new_state=%{WORD:new_state}"
                ]
            }
        }
    }
}

# Set gateway (used as the event host by the Splunk/webhook outputs).
# Current format: the reporting gateway (the controller sorts the tunnel
# endpoints by name, so src_gw can be an external peer IP).
# Legacy format: the source gateway name, e.g. oregon-transit(AWS us-west-2) -> oregon-transit.
# Two mutates because mutate runs copy after gsub within one block.
filter {
    if "tunnel_status" in [tags] and [reporting_gw] and ![gateway] {
        mutate {
            id => "tunnel-status-reporting-gateway"
            copy => { "reporting_gw" => "gateway" }
        }
    }
    if "tunnel_status" in [tags] and [src_gw] and ![gateway] {
        mutate {
            id => "tunnel-status-copy-gateway"
            copy => { "src_gw" => "gateway" }
        }
        mutate {
            id => "tunnel-status-gateway-name"
            gsub => [ "gateway", "[(].*$", "" ]
        }
    }
}

# CPU Cores Parser
# Parses protobuf-text cpu_cores field from AviatrixGwSysStats into structured JSON

# Step 1: Parse cpu_cores protobuf text into structured fields
filter {
    if "gw_sys_stats" in [tags] and [cpu_cores] and [cpu_cores] != "" {
        ruby {
            id => "cpu-cores-parse"
            init => '
                # One pass over the protobuf text: each match is either a
                # name:N token or a busy:{...} block (nested start/end blocks
                # are one level deep).
                @cpu_token_re = /name:(-?\d+)|busy:\{((?:[^{}]|\{[^{}]*\})*)\}/
                @cpu_sub_block_re = /(?:start|end):\{[^}]*\}/
                @cpu_stat_re = /(min|max|avg):(\d+)/
            '
            code => '
                raw = event.get("cpu_cores")
                next unless raw.is_a?(String) && raw.length > 2

                # Protobuf text format prints each entry as "name:N busy:{...}".
                # proto3 omits name:0, so a busy block with no name before it
                # is core 0. Pair every busy block with the name before it.
                cores = []
                pending_name = nil
                raw.scan(@cpu_token_re) do |name, body|
                    if name
                        pending_name = name
                    else
                        entry = { "name" => pending_name || "0" }
                        body.gsub(@cpu_sub_block_re, "").scan(@cpu_stat_re) do |key, val|
                            entry["busy_#{key}"] = val.to_i
                        end
                        cores << entry
                        pending_name = nil
                    end
                end

                next if cores.empty?

                # Set parsed array
                event.set("cpu_cores_parsed", cores)

                # Extract aggregate (name=-1) and count individual cores (including core 0)
                aggregate = cores.find { |c| c["name"] == "-1" }
                individual_count = cores.count { |c| c["name"] != "-1" }

                if aggregate
                    event.set("cpu_aggregate_busy_min", aggregate["busy_min"]) if aggregate["busy_min"]
                    event.set("cpu_aggregate_busy_max", aggregate["busy_max"]) if aggregate["busy_max"]
                    event.set("cpu_aggregate_busy_avg", aggregate["busy_avg"]) if aggregate["busy_avg"]
                    # cpu_busy: prefer avg, fall back to max
                    if aggregate["busy_avg"]
                        event.set("cpu_busy", aggregate["busy_avg"])
                    elsif aggregate["busy_max"]
                        event.set("cpu_busy", aggregate["busy_max"])
                    end
                end

                # Fallback: compute cpu_busy from cpu_idle if no aggregate found
                if !aggregate
                    cpu_idle = event.get("cpu_idle")
                    if cpu_idle
                        idle_val = cpu_idle.is_a?(Numeric) ? cpu_idle : cpu_idle.to_f
                        event.set("cpu_busy", (100 - idle_val).round(1))
                    end
                end

                event.set("cpu_core_count", individual_count) if individual_count > 0
            '
        }
    }
}

# VPN Session Filter
# Parses AviatrixVPNSession syslog messages (connect/disconnect events)

filter {
    if [type] == "syslog" and "AviatrixVPNSession" in [message] {
        grok {
            id => "vpn-session"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["vpn_session"]
            tag_on_failure => ["_avx_grok_failure_vpn_session"]
            match => {
                "message" => [
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixVPNSession: User=%{DATA:vpn_user}, Status=%{WORD:vpn_status}, Gateway=%{DATA:vpn_gateway}, GatewayIP=%{DATA:vpn_gateway_ip}, VPNVirtualIP=%{DATA:vpn_virtual_ip}, PublicIP=%{DATA:vpn_public_ip}, Login=%{DATA:vpn_login}, Logout=%{DATA:vpn_logout}, Duration=%{DATA:vpn_duration}, RXbytes=%{DATA:vpn_rx_bytes}, TXbytes=%{DATA:vpn_tx_bytes}, VPNClientPlatform=%{DATA:vpn_client_platform}, VPNClientVersion=%{GREEDYDATA:vpn_client_version}"
                ]
            }
        }
    }
}

# Timestamp Normalization Filter
# Converts the parsed date field to @timestamp and adds unix_time

filter {
    if [date] {
        date {
            id => "date-to-timestamp"
            # Supports multiple timestamp formats:
            # - ISO8601: 2022-05-14T03:46:10.257442+00:00
            # - Long format: 2022-05-14 03:46:10.257442
            # - Short format with double space: Dec  9 03:46:16
            # - Short format with single space: Dec 14 03:46:16
            match => [ "date", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSSSSS", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
            # Syslog timestamps carry no zone; parse them as UTC rather than the
            # JVM default zone (ISO8601 values with an offset keep their offset).
            # Override with SYSLOG_TIMEZONE (e.g. "America/New_York") if your
            # gateways/controllers log local time.
            timezone => "${SYSLOG_TIMEZONE:UTC}"
            target => "@timestamp"
            remove_field => [ "date" ]
        }
    }

    # Add unix timestamp for outputs that require epoch time
    ruby {
        id => "add-unix-time"
        code => "event.set('unix_time', event.get('@timestamp').to_i)"
    }
}

# Save Raw Network Rate/Cumulative Strings
# Preserves original string values (e.g. "54.07Kb", "2.49GB") in [@metadata]
# before filter 95 converts the rate fields to numbers.
#
# Downstream metric builders (Dynatrace MINT, Zabbix JSON) need these raw
# strings to compute accurate byte values (e.g. "54.07Kb" -> 55367.68 bytes/s).
#
# Runs for every output (a cheap copy into [@metadata], which no output sends).

filter {
    if "gw_net_stats" in [tags] {
        mutate {
            id => "save-raw-net-rates"
            copy => {
                "total_rx_rate" => "[@metadata][raw_total_rx_rate]"
                "total_tx_rate" => "[@metadata][raw_total_tx_rate]"
                "total_rx_tx_rate" => "[@metadata][raw_total_rx_tx_rate]"
                "total_rx_cum" => "[@metadata][raw_total_rx_cum]"
                "total_tx_cum" => "[@metadata][raw_total_tx_cum]"
                "total_rx_tx_cum" => "[@metadata][raw_total_rx_tx_cum]"
            }
        }
    }
}

# Field Type Conversion Filter
# Converts string fields to their proper types for downstream processing

# Microseg field conversions
filter {
    if "microseg" in [tags] {
        mutate {
            id => "microseg-field-conversion"
            convert => {
                "src_port" => "integer"
                "dst_port" => "integer"
                "enforced" => "boolean"
            }
        }
    }
}

# MITM field conversions (ports and enforced set as strings by mutate add_field)
filter {
    if "mitm" in [tags] {
        mutate {
            id => "mitm-field-conversion"
            convert => {
                "src_port" => "integer"
                "dst_port" => "integer"
                "enforced" => "boolean"
            }
        }
    }
}

# Gateway network stats field conversions
# Rates arrive as human-readable strings ("186.97Kb", "1.5Mb", "3.73").
# Convert each one to a float in bytes/s, using the same unit rules as the
# Dynatrace/Zabbix builders (K/M/G/T = x1024 steps, no unit = bytes), so every
# output gets values in one comparable unit. The raw strings are kept in
# [@metadata][raw_total_*] by filter 94.
filter {
    if "gw_net_stats" in [tags] {
        ruby {
            id => "gw_net_stats-rate-conversion"
            init => '
                @net_rate_fields = ["total_rx_rate", "total_tx_rate", "total_rx_tx_rate"]
                @net_rate_re = /\A([\d.]+)\s*([KMGT]?)B?\z/i
                @net_rate_mult = { "" => 1, "K" => 1024, "M" => 1024 ** 2, "G" => 1024 ** 3, "T" => 1024 ** 4 }
            '
            code => '
                @net_rate_fields.each do |f|
                    v = event.get(f)
                    next unless v.is_a?(String)
                    m = @net_rate_re.match(v.strip)
                    next unless m
                    event.set(f, (m[1].to_f * @net_rate_mult[m[2].upcase]).round(2))
                end
            '
        }
    }
}

# Gateway system stats field conversions
filter {
    if "gw_sys_stats" in [tags] {
        mutate {
            id => "gw_sys_stats-field-conversion"
            convert => {
                "cpu_idle" => "float"
                "memory_free" => "integer"
                "memory_available" => "integer"
                "memory_total" => "integer"
                "disk_total" => "integer"
                "disk_free" => "integer"
            }
        }
    }
}

# System Stats HEC Payload Builder
# Builds Splunk HEC payload for gw_sys_stats events (same pattern as suricata)
# Uses format => "message" so cpu_cores_parsed serializes as a proper JSON array
#
# Runs after 90-timestamp.conf (unix_time) and 95-field-conversion.conf (type coercions)

filter {
    if "gw_sys_stats" in [tags] {
        ruby {
            id => "sys-stats-hec-payload"
            init => '
                require "json"
            '
            code => '
                event_data = {
                    "gateway" => event.get("gateway"),
                    "alias" => event.get("alias"),
                    "cpu_idle" => event.get("cpu_idle"),
                    "memory_free" => event.get("memory_free"),
                    "memory_available" => event.get("memory_available"),
                    "memory_total" => event.get("memory_total"),
                    "disk_total" => event.get("disk_total"),
                    "disk_free" => event.get("disk_free"),
                    "syslog" => event.get("message")
                }

                # Add cpu_cores fields only if they exist (gateway events, not controller)
                cpu_busy = event.get("cpu_busy")
                event_data["cpu_busy"] = cpu_busy if cpu_busy

                cpu_core_count = event.get("cpu_core_count")
                event_data["cpu_core_count"] = cpu_core_count if cpu_core_count

                cpu_cores_parsed = event.get("cpu_cores_parsed")
                event_data["cpu_cores_parsed"] = cpu_cores_parsed if cpu_cores_parsed

                cpu_cores_raw = event.get("cpu_cores")
                event_data["cpu_cores_raw"] = cpu_cores_raw if cpu_cores_raw

                agg_min = event.get("cpu_aggregate_busy_min")
                event_data["cpu_aggregate_busy_min"] = agg_min if agg_min

                agg_max = event.get("cpu_aggregate_busy_max")
                event_data["cpu_aggregate_busy_max"] = agg_max if agg_max

                agg_avg = event.get("cpu_aggregate_busy_avg")
                event_data["cpu_aggregate_busy_avg"] = agg_avg if agg_avg

                # Remove nil values
                event_data.delete_if { |_k, v| v.nil? }

                payload = {
                    "sourcetype" => "aviatrix:gateway:system",
                    "source" => "avx-gw-sys-stats",
                    "host" => event.get("gateway"),
                    "time" => event.get("unix_time"),
                    "event" => event_data
                }

                event.set("[@metadata][sys_stats_hec_payload]", payload.to_json)
            '
        }
    }
}

# Unparsed Event Tagging
# Tags any event that no type filter recognized (no known type tag) as
# "unparsed", so format drift is visible instead of silently disappearing.
# Grok failures also carry a specific "_avx_grok_failure_<type>" tag, and
# invalid Suricata/MITM JSON carries "_avx_json_parse_failure".
#
# Outputs route on type tags, so unparsed events are not forwarded unless an
# output adds a branch for the "unparsed" tag (e.g. a debug/dead-letter sink).

filter {
    if !("microseg" in [tags] or "mitm" in [tags] or "suricata" in [tags] or "fqdn" in [tags] or "cmd" in [tags] or "gw_net_stats" in [tags] or "gw_sys_stats" in [tags] or "tunnel_status" in [tags] or "vpn_session" in [tags]) {
        mutate {
            id => "tag-unparsed"
            add_tag => ["unparsed"]
        }
    }
}

# ============================================================================
# OUTPUT CONFIGURATION (azure-log-ingestion)
# ============================================================================

# Azure Log Analytics / Sentinel Output (via Data Collection Rules)
# Uses the Microsoft Sentinel Log Analytics Logstash output plugin
#
# Security log types are ASIM-normalized:
#   - Suricata IDS alerts → Custom-AviatrixIDS_CL (ASIM NetworkSession, EventType=IDS)
#   - L7 MITM/DCF (TLS inspection) → Custom-AviatrixWebSession_CL (ASIM WebSession)
#   - L4 Microsegmentation → Custom-AviatrixNetworkSession_CL (ASIM NetworkSession)
#
# Non-security log types (unchanged):
#   - Gateway Network Stats → Custom-AviatrixGwNetStats_CL
#   - Gateway System Stats → Custom-AviatrixGwSysStats_CL
#   - Controller CMD/API → Custom-AviatrixCmd_CL
#   - Tunnel Status Changes → Custom-AviatrixTunnelStatus_CL
#   - VPN Sessions → Custom-AviatrixVPNSession_CL
#
# Every azure_dcr_* / azure_stream_* variable below has no default, and
# Logstash resolves env placeholders when it compiles the pipeline (regardless of
# LOG_PROFILE), so ALL 8 DCR/stream pairs must be set or the pipeline fails
# to load.
#
# Columns: the DCRs drop any field not declared in their stream declaration.
# When adding a field here, also add it to
# deployments/azure-aci/module/ai/4-table-schemas.tf.
#
# Environment Variables:
#   client_app_id               - Azure AD application (service principal) ID
#   client_app_secret           - Azure AD application secret
#   tenant_id                   - Azure AD tenant ID
#   data_collection_endpoint    - Data Collection Endpoint URL
#   azure_dcr_ids_id            - DCR immutable ID for IDS (Suricata) logs
#   azure_stream_ids            - Stream name for IDS logs
#   azure_dcr_netsession_id     - DCR immutable ID for L4 Network Session logs
#   azure_stream_netsession     - Stream name for L4 Network Session logs
#   azure_dcr_websession_id     - DCR immutable ID for L7 Web Session logs
#   azure_stream_websession     - Stream name for L7 Web Session logs
#   azure_dcr_gw_net_stats_id   - DCR immutable ID for Gateway Network Stats
#   azure_stream_gw_net_stats   - Stream name for Gateway Network Stats
#   azure_dcr_gw_sys_stats_id   - DCR immutable ID for Gateway System Stats
#   azure_stream_gw_sys_stats   - Stream name for Gateway System Stats
#   azure_dcr_cmd_id            - DCR immutable ID for Controller CMD/API logs
#   azure_stream_cmd            - Stream name for Controller CMD/API logs
#   azure_dcr_tunnel_status_id  - DCR immutable ID for Tunnel Status logs
#   azure_stream_tunnel_status  - Stream name for Tunnel Status logs
#   azure_dcr_vpn_session_id    - DCR immutable ID for VPN Session logs
#   azure_stream_vpn_session    - Stream name for VPN Session logs
#   azure_cloud                 - "AzureCloud", "AzureChinaCloud", or "AzureUSGovernment"
#   LOG_PROFILE                 - Which log types to forward (default: all)
#                                 - all: Forward all log types
#                                 - security: suricata, mitm, microseg, cmd, vpn_session
#                                   (fqdn has no Azure output)
#                                 - networking: gw_net_stats, gw_sys_stats, tunnel_status

# =============================================================================
# ASIM Field Mapping for Security Log Types
# =============================================================================
# These filters add ASIM-normalized fields alongside the original Aviatrix fields.
# Only applied when assembling for Azure output — Splunk configs never see this.

# Suricata IDS → ASIM NetworkSession (EventType=IDS)
filter {
    if "suricata" in [tags] {
        # Flatten suricataDataJson first (needed for ASIM mapping)
        ruby {
            id => "suricata-azure-flatten"
            code => "
                if event.get('suricataDataJson')
                    event.get('suricataDataJson').each { |k, v| event.set(k, v) }
                    event.remove('suricataDataJson')
                end
            "
        }

        # ASIM common fields
        mutate {
            id => "suricata-asim-common"
            add_field => {
                "EventVendor" => "Aviatrix"
                "EventProduct" => "Suricata IDS"
                "EventSchema" => "NetworkSession"
                "EventSchemaVersion" => "0.2.7"
                "EventType" => "IDS"
                "EventCount" => 1
            }
        }

        # ASIM field mapping via Ruby (action, severity, threat fields, flow fields)
        ruby {
            id => "suricata-asim-mapping"
            code => "
                event.set('TimeGenerated', event.get('@timestamp'))
                event.set('EventStartTime', event.get('@timestamp'))
                event.set('EventEndTime', event.get('@timestamp'))

                # Network addressing — Suricata uses dest_ip/dest_port
                event.set('SrcIpAddr', event.get('src_ip')) if event.get('src_ip')
                event.set('DstIpAddr', event.get('dest_ip')) if event.get('dest_ip')
                event.set('SrcPortNumber', event.get('src_port')) if event.get('src_port')
                event.set('DstPortNumber', event.get('dest_port')) if event.get('dest_port')
                event.set('NetworkProtocol', event.get('proto')) if event.get('proto')
                event.set('DvcInboundInterface', event.get('in_iface')) if event.get('in_iface')

                # Device identity: the gateway that raised the alert
                # (gw_hostname is removed by suricata-azure-cleanup below)
                event.set('DvcHostname', event.get('gw_hostname')) if event.get('gw_hostname')

                # App protocol (uppercase)
                if event.get('app_proto')
                    event.set('NetworkApplicationProtocol', event.get('app_proto').to_s.upcase)
                end

                # Flow session ID
                event.set('NetworkSessionId', event.get('flow_id').to_s) if event.get('flow_id')

                # DvcAction mapping
                alert = event.get('[alert]') || {}
                action = alert['action'].to_s.downcase rescue ''
                original_action = alert['action'].to_s rescue ''
                event.set('DvcOriginalAction', original_action)
                case action
                when 'allowed'
                    event.set('DvcAction', 'Allow')
                    event.set('EventResult', 'Success')
                when 'blocked'
                    event.set('DvcAction', 'Drop')
                    event.set('EventResult', 'Failure')
                else
                    event.set('DvcAction', original_action)
                    event.set('EventResult', 'NA')
                end

                # Severity mapping
                severity = (alert['severity'].to_i rescue 0)
                case severity
                when 1
                    event.set('EventSeverity', 'High')
                    event.set('ThreatRiskLevel', 75)
                when 2
                    event.set('EventSeverity', 'Medium')
                    event.set('ThreatRiskLevel', 50)
                when 3
                    event.set('EventSeverity', 'Low')
                    event.set('ThreatRiskLevel', 25)
                else
                    event.set('EventSeverity', 'Informational')
                    event.set('ThreatRiskLevel', 10)
                end
                event.set('ThreatOriginalRiskLevel', severity.to_s)

                # Threat fields from alert
                event.set('ThreatName', alert['signature']) if alert['signature']
                event.set('ThreatId', alert['signature_id'].to_s) if alert['signature_id']
                event.set('ThreatCategory', alert['category']) if alert['category']
                event.set('NetworkRuleName', alert['signature']) if alert['signature']
                event.set('NetworkRuleNumber', alert['signature_id'].to_i) if alert['signature_id']

                # Flow byte/packet counts
                flow = event.get('[flow]') || {}
                event.set('SrcBytes', flow['bytes_toserver']) if flow['bytes_toserver']
                event.set('DstBytes', flow['bytes_toclient']) if flow['bytes_toclient']
                event.set('SrcPackets', flow['pkts_toserver']) if flow['pkts_toserver']
                event.set('DstPackets', flow['pkts_toclient']) if flow['pkts_toclient']
            "
        }

        mutate {
            id => "suricata-azure-cleanup"
            remove_field => ["message", "suricataData", "gw_hostname", "host", "port", "type", "event"]
        }

        mutate {
            id => "suricata-asim-int-coerce"
            convert => {
                "EventCount" => "integer"
                "SrcPortNumber" => "integer"
                "DstPortNumber" => "integer"
                "NetworkRuleNumber" => "integer"
                "ThreatRiskLevel" => "integer"
                "SrcBytes" => "integer"
                "DstBytes" => "integer"
                "SrcPackets" => "integer"
                "DstPackets" => "integer"
            }
        }
    }
}

# L4 Microseg → ASIM NetworkSession
filter {
    if "microseg" in [tags] and "mitm" not in [tags] {
        # ASIM common fields
        mutate {
            id => "microseg-asim-common"
            add_field => {
                "EventVendor" => "Aviatrix"
                "EventProduct" => "Distributed Cloud Firewall"
                "EventSchema" => "NetworkSession"
                "EventSchemaVersion" => "0.2.7"
                "EventType" => "NetworkSession"
                "EventCount" => 1
            }
        }

        # ASIM field mapping via Ruby
        ruby {
            id => "microseg-asim-mapping"
            code => "
                event.set('TimeGenerated', event.get('@timestamp'))
                event.set('EventStartTime', event.get('@timestamp'))
                event.set('EventEndTime', event.get('@timestamp'))

                # Network addressing
                event.set('SrcIpAddr', event.get('src_ip')) if event.get('src_ip')
                event.set('DstIpAddr', event.get('dst_ip')) if event.get('dst_ip')
                event.set('SrcPortNumber', event.get('src_port')) if event.get('src_port')
                event.set('DstPortNumber', event.get('dst_port')) if event.get('dst_port')
                event.set('NetworkProtocol', event.get('proto')) if event.get('proto')
                event.set('SrcMacAddr', event.get('src_mac')) if event.get('src_mac')
                event.set('DstMacAddr', event.get('dst_mac')) if event.get('dst_mac')

                # Device fields
                event.set('DvcHostname', event.get('gw_hostname')) if event.get('gw_hostname')
                event.set('DvcIpAddr', event.get('gw_ip')) if event.get('gw_ip')

                # Rule/session fields
                event.set('NetworkRuleName', event.get('uuid')) if event.get('uuid')
                event.set('NetworkSessionId', event.get('session_id').to_s) if event.get('session_id')
                event.set('NetworkBytes', event.get('session_byte_cnt')) if event.get('session_byte_cnt')
                event.set('NetworkPackets', event.get('session_pkt_cnt')) if event.get('session_pkt_cnt')

                # Session duration: convert nanoseconds to milliseconds
                if event.get('session_dur')
                    dur_ns = event.get('session_dur').to_i
                    event.set('NetworkDuration', dur_ns / 1_000_000)
                end

                # Session event subtype (Start/End/PolicyUpdate, set by 10-microseg.conf)
                if event.get('session_event_type')
                    event.set('EventSubType', event.get('session_event_type'))
                end

                # Session end reason as ASIM EventOriginalResultDetails
                if event.get('session_end_reason_text')
                    event.set('EventOriginalResultDetails', event.get('session_end_reason_text'))
                end

                # DvcAction mapping
                action = event.get('action').to_s.upcase rescue ''
                event.set('DvcOriginalAction', event.get('action').to_s)
                case action
                when 'PERMIT'
                    event.set('DvcAction', 'Allow')
                    event.set('EventResult', 'Success')
                    event.set('EventSeverity', 'Informational')
                when 'DENY'
                    event.set('DvcAction', 'Deny')
                    event.set('EventResult', 'Failure')
                    event.set('EventSeverity', 'Low')
                else
                    event.set('DvcAction', event.get('action').to_s)
                    event.set('EventResult', 'NA')
                    event.set('EventSeverity', 'Informational')
                end
            "
        }

        mutate {
            id => "microseg-azure-cleanup"
            remove_field => ["message", "host", "port", "type", "event", "@version", "syslog_pri", "data_hex"]
        }

        mutate {
            id => "microseg-asim-int-coerce"
            convert => {
                "EventCount" => "integer"
                "SrcPortNumber" => "integer"
                "DstPortNumber" => "integer"
                "NetworkBytes" => "integer"
                "NetworkDuration" => "integer"
                "NetworkPackets" => "integer"
            }
        }
    }
}

# L7 MITM/DCF → ASIM WebSession
filter {
    if "mitm" in [tags] {
        # ASIM common fields
        mutate {
            id => "mitm-asim-common"
            add_field => {
                "EventVendor" => "Aviatrix"
                "EventProduct" => "Distributed Cloud Firewall"
                "EventSchema" => "WebSession"
                "EventSchemaVersion" => "0.2.7"
                "EventType" => "HTTPsession"
                "EventCount" => 1
            }
        }

        # ASIM field mapping via Ruby
        ruby {
            id => "mitm-asim-mapping"
            code => "
                event.set('TimeGenerated', event.get('@timestamp'))
                event.set('EventStartTime', event.get('@timestamp'))
                event.set('EventEndTime', event.get('@timestamp'))

                # Network addressing
                event.set('SrcIpAddr', event.get('src_ip')) if event.get('src_ip')
                event.set('DstIpAddr', event.get('dst_ip')) if event.get('dst_ip')
                event.set('SrcPortNumber', event.get('src_port')) if event.get('src_port')
                event.set('DstPortNumber', event.get('dst_port')) if event.get('dst_port')
                event.set('NetworkProtocol', 'TCP')

                # TLS/HTTP fields
                event.set('DstFqdn', event.get('mitm_sni_hostname')) if event.get('mitm_sni_hostname')
                event.set('DstHostname', event.get('mitm_sni_hostname')) if event.get('mitm_sni_hostname')
                event.set('Url', event.get('mitm_url_parts')) if event.get('mitm_url_parts')

                # Device fields
                event.set('DvcHostname', event.get('gw_hostname')) if event.get('gw_hostname')
                event.set('DvcIpAddr', event.get('gw_ip')) if event.get('gw_ip')

                # Rule
                event.set('NetworkRuleName', event.get('uuid')) if event.get('uuid')

                # Byte counts (ASIM WebSession)
                event.set('SrcBytes', event.get('mitm_request_bytes').to_i) if event.get('mitm_request_bytes')
                event.set('DstBytes', event.get('mitm_response_bytes').to_i) if event.get('mitm_response_bytes')

                # Session correlation
                event.set('NetworkSessionId', event.get('mitm_session_id')) if event.get('mitm_session_id')

                # Suricata signature ID for IDS/IPS events
                event.set('ThreatId', event.get('mitm_sid')) if event.get('mitm_sid')

                # Event sub-type from reason
                event.set('EventSubType', event.get('mitm_reason')) if event.get('mitm_reason')

                # DvcAction mapping (MITM uses Permit/DENY/DROP)
                action = event.get('action').to_s
                event.set('DvcOriginalAction', action)
                case action.downcase
                when 'permit'
                    event.set('DvcAction', 'Allow')
                    event.set('EventResult', 'Success')
                    event.set('EventSeverity', 'Informational')
                when 'deny', 'drop'
                    event.set('DvcAction', 'Deny')
                    event.set('EventResult', 'Failure')
                    event.set('EventSeverity', 'Low')
                else
                    event.set('DvcAction', action)
                    event.set('EventResult', 'NA')
                    event.set('EventSeverity', 'Informational')
                end
            "
        }

        mutate {
            id => "mitm-azure-cleanup"
            remove_field => ["message", "host", "port", "type", "event", "@version", "syslog_pri"]
        }

        mutate {
            id => "mitm-asim-int-coerce"
            convert => {
                "EventCount" => "integer"
                "SrcPortNumber" => "integer"
                "DstPortNumber" => "integer"
            }
        }
    }
}

