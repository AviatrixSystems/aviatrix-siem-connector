# Aviatrix SIEM Connector - Assembled Configuration
# Output Type: splunk-hec
#
# This file was automatically generated by assemble-config.sh
# Do not edit directly - modify the source modules instead:
#   - logstash-configs/inputs/
#   - logstash-configs/filters/
#   - logstash-configs/outputs/splunk-hec/
#
# To regenerate: ./scripts/assemble-config.sh splunk-hec

# ============================================================================
# INPUT CONFIGURATION
# ============================================================================

# Syslog Input Configuration
# Receives Aviatrix syslog messages on UDP/TCP port ${SYSLOG_PORT} (default 5000).
# The AWS deployments set SYSLOG_PORT from their syslog_port variable so the
# listener, Docker port mapping, security group and NLB always agree.

input {
    udp {
        port => "${SYSLOG_PORT:5000}"
        type => syslog
    }
    tcp {
        port => "${SYSLOG_PORT:5000}"
        type => syslog
    }
}

# ============================================================================
# FILTER CONFIGURATION
# ============================================================================

# L4 Microsegmentation (eBPF) Filter
# Parses AviatrixGwMicrosegPacket syslog messages
# Supports both legacy 7.x and 8.2+ formats (with or without session fields)

filter {
    if [type] == "syslog" and "AviatrixGwMicrosegPacket" in [message] {
        grok {
            id => "microseg"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["microseg", "ebpf"]
            tag_on_failure => ["_avx_grok_failure_microseg"]
            match => {
                "message" => [
                    # 8.2+ format: GW-<name>-<ip>-sink with /usr/local/bin/avx-gw-state-sync process.
                    # The SESSION_* fields are optional: they are absent on the first packet of a flow.
                    # (One pattern with an optional suffix, so a session-less line is scanned once.)
                    "^<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date} +GW-%{DATA:gw_hostname}-%{IP:gw_ip}%{DATA}AviatrixGwMicrosegPacket: POLICY=%{UUID:uuid} SRC_MAC=%{MAC:src_mac} DST_MAC=%{MAC:dst_mac} IP_SZ=%{NUMBER:ip_size} SRC_IP=%{IP:src_ip} DST_IP=%{IP:dst_ip} PROTO=%{WORD:proto} SRC_PORT=%{NUMBER:src_port} DST_PORT=%{NUMBER:dst_port} DATA=%{NOTSPACE:data_hex} ACT=%{WORD:action} ENFORCED=%{WORD:enforced}(?: SESSION_ID=%{NUMBER:session_id} SESSION_EVENT=%{NUMBER:session_event} SESSION_END_REASON=%{NUMBER:session_end_reason} SESSION_PKT_CNT=%{NUMBER:session_pkt_cnt} SESSION_BYTE_CNT=%{NUMBER:session_byte_cnt} SESSION_DUR=%{NUMBER:session_dur})?",

                    # Legacy format (SPT/DPT/ACTION)
                    "^<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date} +%{HOSTNAME:gw_hostname} +AviatrixGwMicrosegPacket: SRC_MAC=%{MAC:src_mac} DST_MAC=%{MAC:dst_mac} PROTO=%{WORD:proto} SPT=%{NUMBER:src_port} DPT=%{NUMBER:dst_port} ACTION=%{WORD:action}"
                ]
            }
            remove_field => ["event", "@version", "type", "host"]
        }
    }
}

# Set default values for fields missing in legacy microseg format
filter {
    if "microseg" in [tags] and ![src_ip] {
        mutate {
            id => "microseg-legacy-defaults"
            add_field => {
                "src_ip" => "unknown"
                "dst_ip" => "unknown"
                "uuid" => "legacy-format"
                "enforced" => "unknown"
            }
        }
    }
}

# Enrich session fields with human-readable text (8.2+ events only)
# Uses PAN-OS naming conventions for session_event and session_end_reason
filter {
    if "microseg" in [tags] and [session_event] {
        ruby {
            id => "microseg-session-enrichment"
            init => "
                # session_end_reason: PAN-OS naming
                @session_end_reason_map = {
                    0 => 'active',
                    1 => 'tcp-fin',
                    2 => 'tcp-rst',
                    3 => 'timeout',
                    4 => 'tcp-rst-from-client',
                    5 => 'tcp-rst-from-server'
                }
            "
            code => "
                # session_event: 0=Start, 1=End
                se = event.get('session_event').to_i
                event.set('session_event_type', se == 0 ? 'Start' : 'End')

                ser = event.get('session_end_reason')
                if ser
                    event.set('session_end_reason_text', @session_end_reason_map.fetch(ser.to_i, 'unknown'))
                end
            "
        }
    }
}

# L7 DCF / MITM (TLS Inspection) Filter
# Parses traffic_server JSON syslog messages

filter {
    if [type] == "syslog" and "traffic_server[" in [message] {
        grok {
            id => "mitm"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["mitm"]
            tag_on_failure => ["_avx_grok_failure_mitm"]
            match => {
                "message" => [
                    # traffic_server JSON format with syslog priority
                    "<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date} +GW-%{DATA:gw_hostname}-%{IP}%{DATA}traffic_server\[%{NUMBER}\]: %{GREEDYDATA:[@metadata][json_payload]}"
                ]
            }
            remove_field => ["event", "@version", "type", "host"]
        }

        # Parse JSON payload
        if "mitm" in [tags] {
            json {
                id => "mitm-json"
                skip_on_invalid_json => true
                source => "[@metadata][json_payload]"
                target => "[@metadata][payload]"
            }
        }

        # Invalid or truncated JSON: skip_on_invalid_json never adds
        # _jsonparsefailure, so check for the parsed payload instead. Re-tag the
        # event so outputs do not send it as a (broken) MITM event.
        if "mitm" in [tags] and ![@metadata][payload] {
            mutate {
                id => "mitm-json-failure-retag"
                remove_tag => ["mitm"]
                add_tag => ["_avx_json_parse_failure"]
            }
        }

        # Convert MITM to microseg format
        if "mitm" in [tags] and [@metadata][payload] and "_jsonparsefailure" not in [tags] {
            # Use timestamp provided by MITM instead of syslog timestamp
            date {
                id => "mitm-timestamp"
                match => [ "[@metadata][payload][timestamp]", "UNIX" ]
                target => "@timestamp"
                remove_field => "date"
            }

            # Map MITM fields to microseg fields.
            # Only copy keys that exist in the payload: a sprintf reference to a
            # missing key would leave the literal "%{[@metadata][payload][x]}"
            # text in the field (e.g. CONNECTION_SYN_ONLY_TIMEOUT has no
            # sni_hostname or decided_by). Values are copied as strings, as
            # mutate add_field did; 95-field-conversion.conf converts types.
            # The top-level action keeps the original value (the Azure output
            # reports it as DvcOriginalAction); only the payload copy is
            # normalized from DROP to DENY, as before.
            ruby {
                id => "mitm-map-to-microseg"
                init => '
                    require "json"
                    @mitm_field_map = {
                        "action" => "action",
                        "src" => "src_ip",
                        "src_port" => "src_port",
                        "dest" => "dst_ip",
                        "dest_port" => "dst_port",
                        "enforced" => "enforced",
                        "decided_by" => "uuid",
                        "sni_hostname" => "mitm_sni_hostname",
                        "reason" => "mitm_reason",
                        "session_id" => "mitm_session_id",
                        "session_stage" => "mitm_session_stage",
                        "stage" => "mitm_stage",
                        "ids" => "mitm_ids",
                        "priority" => "mitm_priority"
                    }
                '
                code => '
                    event.set("proto", "TCP")
                    payload = event.get("[@metadata][payload]")
                    if payload.is_a?(Hash)
                        @mitm_field_map.each do |src, dst|
                            v = payload[src]
                            next if v.nil?
                            event.set(dst, (v.is_a?(Hash) || v.is_a?(Array)) ? v.to_json : v.to_s)
                        end
                        if payload["action"] == "DROP"
                            event.set("[@metadata][payload][action]", "DENY")
                        end
                    end
                '
            }

            # Add URL if present
            if [@metadata][payload][url] {
                mutate {
                    id => "mitm-url-parts"
                    add_field => {
                        "mitm_url_parts" => "%{[@metadata][payload][url]}"
                    }
                }
            }

            # Add decrypted_by if present
            if [@metadata][payload][decrypted_by] {
                mutate {
                    id => "mitm-decrypted-by"
                    add_field => {
                        "mitm_decrypted_by" => "%{[@metadata][payload][decrypted_by]}"
                    }
                }
            }

            # Add request_bytes if present (session end)
            if [@metadata][payload][request_bytes] {
                mutate {
                    id => "mitm-request-bytes"
                    add_field => {
                        "mitm_request_bytes" => "%{[@metadata][payload][request_bytes]}"
                    }
                }
            }

            # Add response_bytes if present (session end)
            if [@metadata][payload][response_bytes] {
                mutate {
                    id => "mitm-response-bytes"
                    add_field => {
                        "mitm_response_bytes" => "%{[@metadata][payload][response_bytes]}"
                    }
                }
            }

            # Add sid if present (IDS/IPS events)
            if [@metadata][payload][sid] {
                mutate {
                    id => "mitm-sid"
                    add_field => {
                        "mitm_sid" => "%{[@metadata][payload][sid]}"
                    }
                }
            }

            # Add session_time if present (not on session start)
            if [@metadata][payload][session_time] {
                mutate {
                    id => "mitm-session-time"
                    add_field => {
                        "mitm_session_time" => "%{[@metadata][payload][session_time]}"
                    }
                }
            }

            # Add message if present (TLS validation events)
            if [@metadata][payload][message] {
                mutate {
                    id => "mitm-tls-message"
                    add_field => {
                        "mitm_message" => "%{[@metadata][payload][message]}"
                    }
                }
            }

        }
    }
}

# Suricata IDS/IPS Filter
# Parses Suricata JSON syslog messages from Aviatrix gateways
#
# Behavior controlled by FLATTEN_SURICATA environment variable:
#   FLATTEN_SURICATA=true  → Flattens nested objects for Splunk (recommended)
#   FLATTEN_SURICATA unset → Keeps nested JSON structure for Azure/other outputs
#
# When flattening is enabled:
#   alert.*    → top level (signature, severity, category, etc.)
#   flow.*     → flow_* (pkts_toserver, bytes_toclient, etc.)
#   http.*     → http_* (hostname, url, method, status, user_agent)
#   tls.*      → tls_* (sni, subject, issuer, ja3, fingerprint)
#   dns.*      → dns_* (query, rrname, rrtype, rdata, ttl)
#   smtp.*     → smtp_* (mail_from, rcpt_to, subject)
#   ssh.*      → ssh_client_*, ssh_server_* (software_version, hassh)
#   fileinfo.* → file_* (filename, size, md5, sha256)
#   tcp.*      → tcp_* (state, tcp_flags)
#   metadata.* → meta_* (confidence, signature_severity - arrays take first value)
#
# Always drops high-volume/low-value fields: files, payload, payload_printable, packet

filter {
    if [type] == "syslog" and "suricata[" in [message] {
        grok {
            id => "suricata"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["suricata"]
            tag_on_failure => ["_avx_grok_failure_suricata"]
            match => {
                "message" => [
                    # Suricata JSON alert format with syslog priority
                    "<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date} +GW-%{DATA:gw_hostname}-%{IP}%{DATA}suricata\[%{NUMBER}\]: %{GREEDYDATA:suricataData}"
                ]
            }
        }

        # Parse JSON data if it looks like valid JSON (starts with { and contains "event_type")
        if "suricata" in [tags] and [suricataData] =~ /^\{.*"event_type"/ {
            json {
                id => "suricata-data"
                skip_on_invalid_json => true
                source => "suricataData"
                target => "suricataDataJson"
            }
        }

        # Drop non-JSON suricata logs (notices, startup messages)
        if "suricata" in [tags] and !([suricataData] =~ /^\{/) {
            drop {
                id => "suricata-non-json-drop"
            }
        }

        # JSON-looking events that did not parse (truncated/invalid JSON, or no
        # "event_type" key). skip_on_invalid_json never adds _jsonparsefailure,
        # so check for the parsed object instead. Re-tag the event so outputs do
        # not send it as suricata (it has no HEC payload).
        if "suricata" in [tags] and ![suricataDataJson] {
            mutate {
                id => "suricata-json-failure-retag"
                remove_tag => ["suricata"]
                add_tag => ["_avx_json_parse_failure"]
            }
        }

        # Drop Suricata stats events (too verbose, not security relevant)
        if [suricataDataJson][event_type] == "stats" {
            drop {
                id => "suricata-stats-drop"
            }
        }

        # Process Suricata JSON data
        # When FLATTEN_SURICATA=true: Flattens all nested objects for Splunk
        # When FLATTEN_SURICATA!=true: Keeps nested structure for Azure/other outputs
        if "suricata" in [tags] and [suricataDataJson] {
            ruby {
                id => "suricata-process"
                init => '
                    require "json"
                    require "time"

                    # Fields to drop (high-volume/low-value) - applies to all outputs
                    @suricata_drop_fields = ["files", "payload", "payload_printable", "packet", "tx_guessed", "policy_id"]
                    @suricata_tls_skip = ["certificate", "chain"]
                    @suricata_meta_skip = ["created_at", "updated_at"]

                    # Nested objects to flatten with their prefixes
                    @suricata_nested_objects = {
                        "flow" => "flow",
                        "http" => "http",
                        "tls" => "tls",
                        "dns" => "dns",
                        "smtp" => "smtp",
                        "ssh" => "ssh",
                        "fileinfo" => "file",
                        "tcp" => "tcp"
                    }

                    def flatten_object(data, obj_name, prefix, skip_keys = [])
                        return {} unless data[obj_name].is_a?(Hash)
                        result = {}
                        data[obj_name].each do |k, v|
                            next if skip_keys.include?(k)
                            if v.is_a?(Hash)
                                v.each do |k2, v2|
                                    next if v2.is_a?(Hash) || v2.is_a?(Array)
                                    result["#{prefix}_#{k}_#{k2}"] = v2
                                end
                            elsif v.is_a?(Array)
                                result["#{prefix}_#{k}"] = v[0] if v[0] && !v[0].is_a?(Hash) && !v[0].is_a?(Array)
                            else
                                result["#{prefix}_#{k}"] = v
                            end
                        end
                        result
                    end
                '
                code => '
                    data = event.get("suricataDataJson")
                    next unless data.is_a?(Hash)

                    drop_fields = @suricata_drop_fields
                    tls_skip = @suricata_tls_skip

                    # Calculate unix timestamp from Suricata timestamp
                    unix_time = nil
                    if data["timestamp"]
                        begin
                            unix_time = Time.parse(data["timestamp"]).to_i
                        rescue
                            unix_time = Time.now.to_i
                        end
                    else
                        unix_time = Time.now.to_i
                    end

                    # Check if flattening is enabled (for Splunk)
                    if ENV["FLATTEN_SURICATA"] == "true"
                        flattened = {}

                        nested_objects = @suricata_nested_objects

                        # Process each top-level field
                        data.each do |key, value|
                            next if drop_fields.include?(key)

                            if key == "alert" && value.is_a?(Hash)
                                # Flatten alert fields to top level (no prefix)
                                value.each do |alert_key, alert_value|
                                    next if alert_value.is_a?(Hash) || alert_value.is_a?(Array)
                                    flattened[alert_key] = alert_value
                                end
                            elsif key == "metadata" && value.is_a?(Hash)
                                # Handle metadata specially - arrays take first value, skip timestamps
                                value.each do |meta_key, meta_value|
                                    next if @suricata_meta_skip.include?(meta_key)
                                    if meta_value.is_a?(Array)
                                        flattened["meta_#{meta_key}"] = meta_value[0] if meta_value[0]
                                    elsif !meta_value.is_a?(Hash)
                                        flattened["meta_#{meta_key}"] = meta_value
                                    end
                                end
                            elsif nested_objects.key?(key)
                                # Flatten known nested objects with appropriate prefix
                                skip_keys = (key == "tls") ? tls_skip : []
                                flattened.merge!(flatten_object(data, key, nested_objects[key], skip_keys))
                            elsif !value.is_a?(Hash) && !value.is_a?(Array)
                                # Keep primitive top-level fields as-is
                                flattened[key] = value
                            end
                        end

                        # Fix http_ prefix duplication (http.http_method → http_method not http_http_method)
                        flattened.keys.select { |k| k.start_with?("http_http_") }.each do |k|
                            new_key = k.sub("http_http_", "http_")
                            flattened[new_key] = flattened.delete(k)
                        end

                        event_data = flattened
                    else
                        # Non-flattened mode: keep nested structure but remove unwanted fields
                        cleaned = data.dup
                        drop_fields.each { |f| cleaned.delete(f) }
                        if cleaned["tls"].is_a?(Hash)
                            tls_skip.each { |f| cleaned["tls"].delete(f) }
                        end
                        event_data = cleaned
                    end

                    # Build complete HEC payload with event as JSON object
                    payload = {
                        "sourcetype" => "aviatrix:ids",
                        "source" => "avx-ids",
                        "host" => event.get("gw_hostname"),
                        "time" => unix_time,
                        "event" => event_data
                    }
                    event.set("[@metadata][suricata_hec_payload]", payload.to_json)
                '
            }
        }
    }
}

# FQDN Firewall Rule Filter
# Parses AviatrixFQDNRule syslog messages

filter {
    if [type] == "syslog" and "AviatrixFQDNRule" in [message] {
        grok {
            id => "fqdn"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["fqdn"]
            tag_on_failure => ["_avx_grok_failure_fqdn"]
            break_on_match => true
            match => {
                "message" => [
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixFQDNRule.*Gateway=%{HOSTNAME:gateway}.*S_IP=%{IP:sip}.*D_IP=%{IP:dip}.*hostname=%{HOSTNAME:hostname}.*state=%{WORD:state}.*drop_reason=%{WORD:drop}.*Rule=%{RULE:rule}.*",
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixFQDNRule.*Gateway=%{HOSTNAME:gateway}.*S_IP=%{IP:sip}.*D_IP=%{IP:dip}.*hostname=%{HOSTNAME:hostname}.*state=%{WORD:state}.*Rule=%{RULE:rule}.*",
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixFQDNRule.*Gateway=%{HOSTNAME:gateway}.*S_IP=%{IP:sip}.*D_IP=%{IP:dip}.*hostname=%{HOSTNAME:hostname}.*state=%{WORD:state}.*drop_reason=%{WORD:drop}",
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixFQDNRule.*Gateway=%{HOSTNAME:gateway}.*S_IP=%{IP:sip}.*D_IP=%{IP:dip}.*hostname=%{HOSTNAME:hostname}.*state=%{WORD:state}.*"
                ]
            }
        }
    }
}

# Controller CMD/API Filter
# Parses AviatrixCMD (V1) and AviatrixAPI (V2.5) syslog messages

# V1 API format (AviatrixCMD)
filter {
    if [type] == "syslog" and "AviatrixCMD" in [message] {
        grok {
            id => "cmd-v1"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["cmd", "V1Api"]
            tag_on_failure => ["_avx_grok_failure_cmd"]
            match => {
                "message" => [
                    # Format with username at end (reason may be empty)
                    "%{SYSLOG_TIMESTAMP:date}.*Controller-%{IP:controller_ip}.*AviatrixCMD: action=%{WORD:action}, argv=%{DATA:args}, result=%{WORD:result}, reason=%{DATA:reason}, username=%{NOTSPACE:username}",
                    # Format without username (reason may be empty)
                    "%{SYSLOG_TIMESTAMP:date}.*Controller-%{IP:controller_ip}.*AviatrixCMD: action=%{WORD:action}, argv=%{DATA:args}, result=%{WORD:result}, reason=%{DATA:reason}$"
                ]
            }
        }
    }
}

# V2.5 API format (AviatrixAPI)
# Runs before the hostname/reason defaults below so V2.5 events get them too.
# The leading fields use DATA (lazy) so a key such as " user=" or
# " resp_status=" inside the JSON in resp_data cannot shift the split;
# only resp_data (the last field) is GREEDYDATA.
filter {
    if [type] == "syslog" and "AviatrixAPI" in [message] and !("cmd" in [tags]) {
        grok {
            id => "cmd-v2"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["cmd", "V2.5API"]
            tag_on_failure => ["_avx_grok_failure_cmd"]
            match => {
                "message" => [
                    # With controller host (Controller-<ip>) in the syslog header
                    "%{SYSLOG_TIMESTAMP:date}.*Controller-%{IP:controller_ip}.*AviatrixAPI.*url=%{DATA:action} user=%{DATA:username} req_data=%{DATA:args} resp_status=%{DATA:result} resp_data=%{GREEDYDATA:reason}",
                    # Without controller host
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixAPI.*url=%{DATA:action} user=%{DATA:username} req_data=%{DATA:args} resp_status=%{DATA:result} resp_data=%{GREEDYDATA:reason}"
                ]
            }
        }
    }
}

# Set gw_hostname for CMD logs (use controller_ip if available)
filter {
    if "cmd" in [tags] and [controller_ip] {
        mutate {
            id => "cmd-set-hostname"
            add_field => { "gw_hostname" => "Controller-%{controller_ip}" }
        }
    }
}

# Set default value for empty reason field in CMD logs
filter {
    if "cmd" in [tags] and (![reason] or [reason] == "") {
        mutate {
            id => "cmd-default-reason"
            replace => { "reason" => "" }
        }
    }
}

# Gateway Performance Statistics Filter
# Parses AviatrixGwNetStats and AviatrixGwSysStats syslog messages

# Network statistics (interface throughput)
filter {
    if [type] == "syslog" and "AviatrixGwNetStats:" in [message] {
        grok {
            id => "gw_net_stats"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["gw_net_stats"]
            tag_on_failure => ["_avx_grok_failure_gw_net_stats"]
            break_on_match => true
            match => {
                "message" => [
                    # With syslog priority prefix and public_ip
                    "<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date}%{DATA}AviatrixGwNetStats:%{DATA}name=%{NOTSPACE:gateway}(?:%{DATA}alias=%{NOTSPACE:alias})?(?:%{DATA}public_ip=%{IP:public_ip})?%{DATA}private_ip=%{IP:private_ip}%{DATA}interface=%{NOTSPACE:interface}%{DATA}total_rx_rate=%{NOTSPACE:total_rx_rate}%{DATA}total_tx_rate=%{NOTSPACE:total_tx_rate}%{DATA}total_rx_tx_rate=%{NOTSPACE:total_rx_tx_rate}%{DATA}total_rx_cum=%{NOTSPACE:total_rx_cum}%{DATA}total_tx_cum=%{NOTSPACE:total_tx_cum}%{DATA}total_rx_tx_cum=%{NOTSPACE:total_rx_tx_cum}(?:%{DATA}conntrack_limit_exceeded=%{NUMBER:conntrack_limit_exceeded})?(?:%{DATA}bw_in_limit_exceeded=%{NUMBER:bw_in_limit_exceeded})?(?:%{DATA}bw_out_limit_exceeded=%{NUMBER:bw_out_limit_exceeded})?(?:%{DATA}pps_limit_exceeded=%{NUMBER:pps_limit_exceeded})?(?:%{DATA}linklocal_limit_exceeded=%{NUMBER:linklocal_limit_exceeded})?(?:%{DATA}conntrack_count=%{NUMBER:conntrack_count})?(?:%{DATA}conntrack_allowance_available=%{NUMBER:conntrack_allowance_available})?(?:%{DATA}conntrack_usage_rate=%{NUMBER:conntrack_usage_rate})?"
                ]
            }
        }
    }
}

# System statistics (CPU, memory, disk)
filter {
    if [type] == "syslog" and "AviatrixGwSysStats:" in [message] {
        grok {
            id => "gw_sys_stats"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["gw_sys_stats"]
            tag_on_failure => ["_avx_grok_failure_gw_sys_stats"]
            break_on_match => true
            match => {
                "message" => [
                    "<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date}%{DATA}AviatrixGwSysStats:%{DATA}name=%{NOTSPACE:gateway}(?:%{DATA}alias=%{NOTSPACE:alias})?%{DATA}cpu_idle=%{NUMBER:cpu_idle}%{DATA}memory_free=%{NUMBER:memory_free}%{DATA}memory_available=%{NUMBER:memory_available}%{DATA}memory_total=%{NUMBER:memory_total}%{DATA}disk_total=%{NUMBER:disk_total}%{DATA}disk_free=%{NUMBER:disk_free}(?:%{DATA}cpu_cores=%{GREEDYDATA:cpu_cores})?"
                ]
            }
        }
    }
}

# Tunnel Status Change Filter
# Parses AviatrixTunnelStatusChange syslog messages

filter {
    if [type] == "syslog" and "AviatrixTunnelStatusChange" in [message] {
        grok {
            id => "tunnel_status"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["tunnel_status"]
            tag_on_failure => ["_avx_grok_failure_tunnel_status"]
            break_on_match => true
            match => {
                "message" => [
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixTunnelStatusChange.*src_gw=%{TUNNEL_GW:src_gw}.*dst_gw=%{TUNNEL_GW:dst_gw}.*old_state=%{WORD:old_state}.*new_state=%{WORD:new_state}"
                ]
            }
        }
    }
}

# Set gateway (used as the event host by the Splunk/webhook outputs) from the
# source gateway name, e.g. src_gw=oregon-transit(AWS us-west-2) -> oregon-transit.
# Two mutates because mutate runs copy after gsub within one block.
filter {
    if "tunnel_status" in [tags] and [src_gw] and ![gateway] {
        mutate {
            id => "tunnel-status-copy-gateway"
            copy => { "src_gw" => "gateway" }
        }
        mutate {
            id => "tunnel-status-gateway-name"
            gsub => [ "gateway", "[(].*$", "" ]
        }
    }
}

# CPU Cores Parser
# Parses protobuf-text cpu_cores field from AviatrixGwSysStats into structured JSON

# Step 1: Parse cpu_cores protobuf text into structured fields
filter {
    if "gw_sys_stats" in [tags] and [cpu_cores] and [cpu_cores] != "" {
        ruby {
            id => "cpu-cores-parse"
            init => '
                # One pass over the protobuf text: each match is either a
                # name:N token or a busy:{...} block (nested start/end blocks
                # are one level deep).
                @cpu_token_re = /name:(-?\d+)|busy:\{((?:[^{}]|\{[^{}]*\})*)\}/
                @cpu_sub_block_re = /(?:start|end):\{[^}]*\}/
                @cpu_stat_re = /(min|max|avg):(\d+)/
            '
            code => '
                raw = event.get("cpu_cores")
                next unless raw.is_a?(String) && raw.length > 2

                # Protobuf text format prints each entry as "name:N busy:{...}".
                # proto3 omits name:0, so a busy block with no name before it
                # is core 0. Pair every busy block with the name before it.
                cores = []
                pending_name = nil
                raw.scan(@cpu_token_re) do |name, body|
                    if name
                        pending_name = name
                    else
                        entry = { "name" => pending_name || "0" }
                        body.gsub(@cpu_sub_block_re, "").scan(@cpu_stat_re) do |key, val|
                            entry["busy_#{key}"] = val.to_i
                        end
                        cores << entry
                        pending_name = nil
                    end
                end

                next if cores.empty?

                # Set parsed array
                event.set("cpu_cores_parsed", cores)

                # Extract aggregate (name=-1) and count individual cores (including core 0)
                aggregate = cores.find { |c| c["name"] == "-1" }
                individual_count = cores.count { |c| c["name"] != "-1" }

                if aggregate
                    event.set("cpu_aggregate_busy_min", aggregate["busy_min"]) if aggregate["busy_min"]
                    event.set("cpu_aggregate_busy_max", aggregate["busy_max"]) if aggregate["busy_max"]
                    event.set("cpu_aggregate_busy_avg", aggregate["busy_avg"]) if aggregate["busy_avg"]
                    # cpu_busy: prefer avg, fall back to max
                    if aggregate["busy_avg"]
                        event.set("cpu_busy", aggregate["busy_avg"])
                    elsif aggregate["busy_max"]
                        event.set("cpu_busy", aggregate["busy_max"])
                    end
                end

                # Fallback: compute cpu_busy from cpu_idle if no aggregate found
                if !aggregate
                    cpu_idle = event.get("cpu_idle")
                    if cpu_idle
                        idle_val = cpu_idle.is_a?(Numeric) ? cpu_idle : cpu_idle.to_f
                        event.set("cpu_busy", (100 - idle_val).round(1))
                    end
                end

                event.set("cpu_core_count", individual_count) if individual_count > 0
            '
        }
    }
}

# VPN Session Filter
# Parses AviatrixVPNSession syslog messages (connect/disconnect events)

filter {
    if [type] == "syslog" and "AviatrixVPNSession" in [message] {
        grok {
            id => "vpn-session"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["vpn_session"]
            tag_on_failure => ["_avx_grok_failure_vpn_session"]
            match => {
                "message" => [
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixVPNSession: User=%{DATA:vpn_user}, Status=%{WORD:vpn_status}, Gateway=%{DATA:vpn_gateway}, GatewayIP=%{DATA:vpn_gateway_ip}, VPNVirtualIP=%{DATA:vpn_virtual_ip}, PublicIP=%{DATA:vpn_public_ip}, Login=%{DATA:vpn_login}, Logout=%{DATA:vpn_logout}, Duration=%{DATA:vpn_duration}, RXbytes=%{DATA:vpn_rx_bytes}, TXbytes=%{DATA:vpn_tx_bytes}, VPNClientPlatform=%{DATA:vpn_client_platform}, VPNClientVersion=%{GREEDYDATA:vpn_client_version}"
                ]
            }
        }
    }
}

# Timestamp Normalization Filter
# Converts the parsed date field to @timestamp and adds unix_time

filter {
    if [date] {
        date {
            id => "date-to-timestamp"
            # Supports multiple timestamp formats:
            # - ISO8601: 2022-05-14T03:46:10.257442+00:00
            # - Long format: 2022-05-14 03:46:10.257442
            # - Short format with double space: Dec  9 03:46:16
            # - Short format with single space: Dec 14 03:46:16
            match => [ "date", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSSSSS", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
            # Syslog timestamps carry no zone; parse them as UTC rather than the
            # JVM default zone (ISO8601 values with an offset keep their offset).
            # Override with SYSLOG_TIMEZONE (e.g. "America/New_York") if your
            # gateways/controllers log local time.
            timezone => "${SYSLOG_TIMEZONE:UTC}"
            target => "@timestamp"
            remove_field => [ "date" ]
        }
    }

    # Add unix timestamp for outputs that require epoch time
    ruby {
        id => "add-unix-time"
        code => "event.set('unix_time', event.get('@timestamp').to_i)"
    }
}

# Save Raw Network Rate/Cumulative Strings
# Preserves original string values (e.g. "54.07Kb", "2.49GB") in [@metadata]
# before filter 95 converts the rate fields to numbers.
#
# Downstream metric builders (Dynatrace MINT, Zabbix JSON) need these raw
# strings to compute accurate byte values (e.g. "54.07Kb" -> 55367.68 bytes/s).
#
# Runs for every output (a cheap copy into [@metadata], which no output sends).

filter {
    if "gw_net_stats" in [tags] {
        mutate {
            id => "save-raw-net-rates"
            copy => {
                "total_rx_rate" => "[@metadata][raw_total_rx_rate]"
                "total_tx_rate" => "[@metadata][raw_total_tx_rate]"
                "total_rx_tx_rate" => "[@metadata][raw_total_rx_tx_rate]"
                "total_rx_cum" => "[@metadata][raw_total_rx_cum]"
                "total_tx_cum" => "[@metadata][raw_total_tx_cum]"
                "total_rx_tx_cum" => "[@metadata][raw_total_rx_tx_cum]"
            }
        }
    }
}

# Field Type Conversion Filter
# Converts string fields to their proper types for downstream processing

# Microseg field conversions
filter {
    if "microseg" in [tags] {
        mutate {
            id => "microseg-field-conversion"
            convert => {
                "src_port" => "integer"
                "dst_port" => "integer"
                "enforced" => "boolean"
            }
        }
    }
}

# MITM field conversions (ports and enforced set as strings by mutate add_field)
filter {
    if "mitm" in [tags] {
        mutate {
            id => "mitm-field-conversion"
            convert => {
                "src_port" => "integer"
                "dst_port" => "integer"
                "enforced" => "boolean"
            }
        }
    }
}

# Gateway network stats field conversions
# Rates arrive as human-readable strings ("186.97Kb", "1.5Mb", "3.73").
# Convert each one to a float in bytes/s, using the same unit rules as the
# Dynatrace/Zabbix builders (K/M/G/T = x1024 steps, no unit = bytes), so every
# output gets values in one comparable unit. The raw strings are kept in
# [@metadata][raw_total_*] by filter 94.
filter {
    if "gw_net_stats" in [tags] {
        ruby {
            id => "gw_net_stats-rate-conversion"
            init => '
                @net_rate_fields = ["total_rx_rate", "total_tx_rate", "total_rx_tx_rate"]
                @net_rate_re = /\A([\d.]+)\s*([KMGT]?)B?\z/i
                @net_rate_mult = { "" => 1, "K" => 1024, "M" => 1024 ** 2, "G" => 1024 ** 3, "T" => 1024 ** 4 }
            '
            code => '
                @net_rate_fields.each do |f|
                    v = event.get(f)
                    next unless v.is_a?(String)
                    m = @net_rate_re.match(v.strip)
                    next unless m
                    event.set(f, (m[1].to_f * @net_rate_mult[m[2].upcase]).round(2))
                end
            '
        }
    }
}

# Gateway system stats field conversions
filter {
    if "gw_sys_stats" in [tags] {
        mutate {
            id => "gw_sys_stats-field-conversion"
            convert => {
                "cpu_idle" => "float"
                "memory_free" => "integer"
                "memory_available" => "integer"
                "memory_total" => "integer"
                "disk_total" => "integer"
                "disk_free" => "integer"
            }
        }
    }
}

# System Stats HEC Payload Builder
# Builds Splunk HEC payload for gw_sys_stats events (same pattern as suricata)
# Uses format => "message" so cpu_cores_parsed serializes as a proper JSON array
#
# Runs after 90-timestamp.conf (unix_time) and 95-field-conversion.conf (type coercions)

filter {
    if "gw_sys_stats" in [tags] {
        ruby {
            id => "sys-stats-hec-payload"
            init => '
                require "json"
            '
            code => '
                event_data = {
                    "gateway" => event.get("gateway"),
                    "alias" => event.get("alias"),
                    "cpu_idle" => event.get("cpu_idle"),
                    "memory_free" => event.get("memory_free"),
                    "memory_available" => event.get("memory_available"),
                    "memory_total" => event.get("memory_total"),
                    "disk_total" => event.get("disk_total"),
                    "disk_free" => event.get("disk_free"),
                    "syslog" => event.get("message")
                }

                # Add cpu_cores fields only if they exist (gateway events, not controller)
                cpu_busy = event.get("cpu_busy")
                event_data["cpu_busy"] = cpu_busy if cpu_busy

                cpu_core_count = event.get("cpu_core_count")
                event_data["cpu_core_count"] = cpu_core_count if cpu_core_count

                cpu_cores_parsed = event.get("cpu_cores_parsed")
                event_data["cpu_cores_parsed"] = cpu_cores_parsed if cpu_cores_parsed

                cpu_cores_raw = event.get("cpu_cores")
                event_data["cpu_cores_raw"] = cpu_cores_raw if cpu_cores_raw

                agg_min = event.get("cpu_aggregate_busy_min")
                event_data["cpu_aggregate_busy_min"] = agg_min if agg_min

                agg_max = event.get("cpu_aggregate_busy_max")
                event_data["cpu_aggregate_busy_max"] = agg_max if agg_max

                agg_avg = event.get("cpu_aggregate_busy_avg")
                event_data["cpu_aggregate_busy_avg"] = agg_avg if agg_avg

                # Remove nil values
                event_data.delete_if { |_k, v| v.nil? }

                payload = {
                    "sourcetype" => "aviatrix:gateway:system",
                    "source" => "avx-gw-sys-stats",
                    "host" => event.get("gateway"),
                    "time" => event.get("unix_time"),
                    "event" => event_data
                }

                event.set("[@metadata][sys_stats_hec_payload]", payload.to_json)
            '
        }
    }
}

# Unparsed Event Tagging
# Tags any event that no type filter recognized (no known type tag) as
# "unparsed", so format drift is visible instead of silently disappearing.
# Grok failures also carry a specific "_avx_grok_failure_<type>" tag, and
# invalid Suricata/MITM JSON carries "_avx_json_parse_failure".
#
# Outputs route on type tags, so unparsed events are not forwarded unless an
# output adds a branch for the "unparsed" tag (e.g. a debug/dead-letter sink).

filter {
    if !("microseg" in [tags] or "mitm" in [tags] or "suricata" in [tags] or "fqdn" in [tags] or "cmd" in [tags] or "gw_net_stats" in [tags] or "gw_sys_stats" in [tags] or "tunnel_status" in [tags] or "vpn_session" in [tags]) {
        mutate {
            id => "tag-unparsed"
            add_tag => ["unparsed"]
        }
    }
}

# ============================================================================
# OUTPUT CONFIGURATION (splunk-hec)
# ============================================================================

# Splunk HTTP Event Collector Output
# Routes events to Splunk based on tags with appropriate source types
#
# Environment Variables:
#   SPLUNK_ADDRESS  - Splunk HEC base URL incl. scheme, e.g. https://splunk.example.com (required)
#   SPLUNK_PORT     - HEC port (default: 8088)
#   SPLUNK_HEC_AUTH - HEC authentication token (required)
#   SPLUNK_INCLUDE_SYSLOG - Include the raw syslog line as event.syslog for
#                     microseg, fqdn, cmd, gw_net_stats, tunnel_status and
#                     vpn_session (default: true). Set to "false" to roughly
#                     halve ingest volume for high-rate microseg traffic.
#   LOG_PROFILE     - Which log types to forward (default: all)
#                     - all: Forward all log types
#                     - security: suricata, mitm, microseg, fqdn, cmd, vpn_session
#                     - networking: gw_net_stats, gw_sys_stats, tunnel_status

# Build HEC payloads for the field-mapped log types.
# The `mapping` option of the http output runs sprintf on every value, which leaves a
# literal "%{field}" when a field is missing (legacy microseg has no session_*
# fields, CMD lines without a user have no username, many gateways have no
# alias/conntrack_* fields). Building the payload in Ruby lets us omit absent
# fields instead (same pattern as the suricata and gw_sys_stats payloads).
# Keep this builder in sync with outputs/webhook-test/output.conf.
filter {
    if (("microseg" in [tags] or "fqdn" in [tags] or "cmd" in [tags] or "vpn_session" in [tags]) and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security"))
       or (("gw_net_stats" in [tags] or "tunnel_status" in [tags]) and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking")) {
        ruby {
            id => "splunk-build-hec-payload"
            init => '
                require "json"
                # [tag, sourcetype, source, host field, event fields, add "timestamp"]
                @hec_specs = [
                    ["microseg", "aviatrix:firewall:l4", "avx-l4-fw", "gw_hostname",
                     %w[proto action src_ip src_port dst_ip dst_port enforced uuid gw_ip src_mac dst_mac ip_size
                        session_id session_event session_end_reason session_pkt_cnt session_byte_cnt session_dur
                        session_event_type session_end_reason_text], true],
                    ["fqdn", "aviatrix:firewall:fqdn", "avx-fqdn", "gateway",
                     %w[sip dip gateway state hostname rule], true],
                    ["cmd", "aviatrix:controller:audit", "avx-cmd", "gw_hostname",
                     %w[action args result reason username], true],
                    ["gw_net_stats", "aviatrix:gateway:network", "avx-gw-net-stats", "gateway",
                     %w[gateway alias public_ip private_ip interface total_rx_rate total_tx_rate total_rx_tx_rate
                        total_rx_cum total_tx_cum total_rx_tx_cum conntrack_limit_exceeded bw_in_limit_exceeded
                        bw_out_limit_exceeded pps_limit_exceeded linklocal_limit_exceeded conntrack_count
                        conntrack_allowance_available conntrack_usage_rate], false],
                    ["tunnel_status", "aviatrix:tunnel:status", "avx-tunnel-status", "gateway",
                     %w[src_gw dst_gw old_state new_state], false],
                    ["vpn_session", "aviatrix:vpn:session", "avx-vpn-session", "vpn_gateway",
                     %w[vpn_user vpn_status vpn_gateway vpn_gateway_ip vpn_virtual_ip vpn_public_ip vpn_login
                        vpn_logout vpn_duration vpn_rx_bytes vpn_tx_bytes vpn_client_platform vpn_client_version], false]
                ]
                @hec_include_syslog = ENV.fetch("SPLUNK_INCLUDE_SYSLOG", "true").strip.downcase != "false"
            '
            code => '
                tags = event.get("tags") || []
                spec = @hec_specs.find { |s| tags.include?(s[0]) }
                if spec
                    _tag, sourcetype, source, host_field, fields, add_ts = spec
                    unix_time = event.get("unix_time")
                    data = {}
                    fields.each do |f|
                        v = event.get(f)
                        data[f] = v unless v.nil?
                    end
                    if @hec_include_syslog
                        msg = event.get("message")
                        data["syslog"] = msg unless msg.nil?
                    end
                    data["timestamp"] = unix_time if add_ts && !unix_time.nil?

                    payload = { "sourcetype" => sourcetype, "source" => source }
                    host = event.get(host_field)
                    payload["host"] = host unless host.nil? || host.to_s.empty?
                    payload["time"] = unix_time unless unix_time.nil?
                    payload["event"] = data
                    event.set("[@metadata][splunk_hec_payload]", payload.to_json)
                end
            '
        }
    }
}

output {
    # Suricata IDS events - flattened structure with alert.* fields at top level
    # Uses pre-built HEC payload to ensure event is a proper JSON object.
    # Events without a payload are skipped rather than POSTed as the literal
    # "%{[@metadata][suricata_hec_payload]}" (HEC would reject it with a 400).
    if "suricata" in [tags] and [@metadata][suricata_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "splunk-suricata"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][suricata_hec_payload]}"
        }
    }

    # L7 DCF / MITM events
    else if "mitm" in [tags] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "splunk-mitm"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "json"
            mapping => {
                "sourcetype" => "aviatrix:firewall:l7"
                "source" => "avx-l7-fw"
                "host" => "%{gw_hostname}"
                "time" => "%{unix_time}"
                "event" => "%{[@metadata][payload]}"
            }
        }
    }

    # L4 Microseg events (payload built above)
    else if "microseg" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "splunk-microseg"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # FQDN Firewall events (payload built above)
    else if "fqdn" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "splunk-fqdn"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # Controller CMD/API events (payload built above)
    else if "cmd" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "splunk-cmd"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # Gateway network statistics (payload built above)
    else if "gw_net_stats" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking") {
        http {
            id => "splunk-gw-net-stats"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # Gateway system statistics - uses pre-built HEC payload for proper JSON serialization
    # of cpu_cores_parsed array (same pattern as suricata output)
    else if "gw_sys_stats" in [tags] and [@metadata][sys_stats_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking") {
        http {
            id => "splunk-gw-sys-stats"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][sys_stats_hec_payload]}"
        }
    }

    # Tunnel status changes (payload built above)
    else if "tunnel_status" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking") {
        http {
            id => "splunk-tunnel-status"
            http_method => "post"
            url => "${SPLUNK_ADDRESS}:${SPLUNK_PORT:8088}/services/collector/event"
            headers => ["Authorization", "Splunk ${SPLUNK_HEC_AUTH}"]
            ssl_verification_mode => "none"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # VPN session events (payload built above)
    else if "vpn_session" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "splunk-vpn-session"
            http_method => "post"
