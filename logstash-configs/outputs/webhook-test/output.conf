# Webhook Test Output
# Sends parsed events to a webhook endpoint for testing.
#
# Mirrors outputs/splunk-hec/output.conf: every log type is sent as the same
# Splunk HEC payload ({sourcetype, source, host, time, event}) that Splunk
# would receive, with the same LOG_PROFILE gating, so the webhook viewer is a
# faithful preview of the Splunk output. Keep the two files in sync.
#
# Environment Variables:
#   WEBHOOK_URL     - Full webhook URL (required)
#   SPLUNK_INCLUDE_SYSLOG - Include the raw syslog line as event.syslog (default: true)
#   LOG_PROFILE     - Which log types to forward (default: all)
#                     - all: Forward all log types
#                     - security: suricata, mitm, microseg, fqdn, cmd, vpn_session
#                     - networking: gw_net_stats, gw_sys_stats, tunnel_status

# Build HEC payloads for the field-mapped log types.
# The `mapping` option of the http output runs sprintf on every value, which leaves a
# literal "%{field}" when a field is missing (legacy microseg has no session_*
# fields, CMD lines without a user have no username, many gateways have no
# alias/conntrack_* fields). Building the payload in Ruby lets us omit absent
# fields instead (same pattern as the suricata and gw_sys_stats payloads).
# Copied from outputs/splunk-hec/output.conf - keep the two in sync.
filter {
    if (("microseg" in [tags] or "fqdn" in [tags] or "cmd" in [tags] or "vpn_session" in [tags]) and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security"))
       or (("gw_net_stats" in [tags] or "tunnel_status" in [tags]) and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking")) {
        ruby {
            id => "webhook-build-hec-payload"
            init => '
                require "json"
                # [tag, sourcetype, source, host field, event fields, add "timestamp"]
                @hec_specs = [
                    ["microseg", "aviatrix:firewall:l4", "avx-l4-fw", "gw_hostname",
                     %w[proto action src_ip src_port dst_ip dst_port enforced uuid gw_ip src_mac dst_mac ip_size
                        session_id session_event session_end_reason session_pkt_cnt session_byte_cnt session_dur
                        session_event_type session_end_reason_text], true],
                    ["fqdn", "aviatrix:firewall:fqdn", "avx-fqdn", "gateway",
                     %w[sip dip gateway state hostname rule], true],
                    ["cmd", "aviatrix:controller:audit", "avx-cmd", "gw_hostname",
                     %w[action args result reason username], true],
                    ["gw_net_stats", "aviatrix:gateway:network", "avx-gw-net-stats", "gateway",
                     %w[gateway alias public_ip private_ip interface total_rx_rate total_tx_rate total_rx_tx_rate
                        total_rx_cum total_tx_cum total_rx_tx_cum conntrack_limit_exceeded bw_in_limit_exceeded
                        bw_out_limit_exceeded pps_limit_exceeded linklocal_limit_exceeded conntrack_count
                        conntrack_allowance_available conntrack_usage_rate], false],
                    ["tunnel_status", "aviatrix:tunnel:status", "avx-tunnel-status", "gateway",
                     %w[src_gw dst_gw old_state new_state reporting_gw src_intf dst_intf], false],
                    ["vpn_session", "aviatrix:vpn:session", "avx-vpn-session", "vpn_gateway",
                     %w[vpn_user vpn_status vpn_gateway vpn_gateway_ip vpn_virtual_ip vpn_public_ip vpn_login
                        vpn_logout vpn_duration vpn_rx_bytes vpn_tx_bytes vpn_client_platform vpn_client_version], false]
                ]
                @hec_include_syslog = ENV.fetch("SPLUNK_INCLUDE_SYSLOG", "true").strip.downcase != "false"
            '
            code => '
                tags = event.get("tags") || []
                spec = @hec_specs.find { |s| tags.include?(s[0]) }
                if spec
                    _tag, sourcetype, source, host_field, fields, add_ts = spec
                    unix_time = event.get("unix_time")
                    data = {}
                    fields.each do |f|
                        v = event.get(f)
                        data[f] = v unless v.nil?
                    end
                    if @hec_include_syslog
                        msg = event.get("message")
                        data["syslog"] = msg unless msg.nil?
                    end
                    data["timestamp"] = unix_time if add_ts && !unix_time.nil?

                    payload = { "sourcetype" => sourcetype, "source" => source }
                    host = event.get(host_field)
                    payload["host"] = host unless host.nil? || host.to_s.empty?
                    payload["time"] = unix_time unless unix_time.nil?
                    payload["event"] = data
                    event.set("[@metadata][splunk_hec_payload]", payload.to_json)
                end
            '
        }
    }
}

output {
    # Suricata IDS events - flattened structure with alert.* fields at top level
    # Uses pre-built HEC payload to ensure event is a proper JSON object.
    # Events without a payload are skipped rather than POSTed as the literal
    # "%{[@metadata][suricata_hec_payload]}" (HEC would reject it with a 400).
    if "suricata" in [tags] and [@metadata][suricata_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "webhook-suricata"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][suricata_hec_payload]}"
        }
    }

    # L7 DCF / MITM events
    else if "mitm" in [tags] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "webhook-mitm"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "json"
            mapping => {
                "sourcetype" => "aviatrix:firewall:l7"
                "source" => "avx-l7-fw"
                "host" => "%{gw_hostname}"
                "time" => "%{unix_time}"
                "event" => "%{[@metadata][payload]}"
            }
        }
    }

    # L4 Microseg events (payload built above)
    else if "microseg" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "webhook-microseg"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # FQDN Firewall events (payload built above)
    else if "fqdn" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "webhook-fqdn"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # Controller CMD/API events (payload built above)
    else if "cmd" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "webhook-cmd"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # Gateway network statistics (payload built above)
    else if "gw_net_stats" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking") {
        http {
            id => "webhook-gw-net-stats"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # Gateway system statistics - uses pre-built HEC payload for proper JSON serialization
    # of cpu_cores_parsed array (same pattern as suricata output)
    else if "gw_sys_stats" in [tags] and [@metadata][sys_stats_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking") {
        http {
            id => "webhook-gw-sys-stats"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][sys_stats_hec_payload]}"
        }
    }

    # Tunnel status changes (payload built above)
    else if "tunnel_status" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "networking") {
        http {
            id => "webhook-tunnel-status"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }

    # VPN session events (payload built above)
    else if "vpn_session" in [tags] and [@metadata][splunk_hec_payload] and ("${LOG_PROFILE:all}" == "all" or "${LOG_PROFILE:all}" == "security") {
        http {
            id => "webhook-vpn-session"
            http_method => "post"
            url => "${WEBHOOK_URL}"
            format => "message"
            content_type => "application/json"
            message => "%{[@metadata][splunk_hec_payload]}"
        }
    }
}
