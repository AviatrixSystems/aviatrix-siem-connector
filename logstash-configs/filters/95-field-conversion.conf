# Field Type Conversion Filter
# Converts string fields to their proper types for downstream processing

# Microseg field conversions
filter {
    if "microseg" in [tags] {
        mutate {
            id => "microseg-field-conversion"
            convert => {
                "src_port" => "integer"
                "dst_port" => "integer"
                "enforced" => "boolean"
            }
        }
    }
}

# MITM field conversions (ports and enforced set as strings by mutate add_field)
filter {
    if "mitm" in [tags] {
        mutate {
            id => "mitm-field-conversion"
            convert => {
                "src_port" => "integer"
                "dst_port" => "integer"
                "enforced" => "boolean"
            }
        }
    }
}

# Gateway network stats field conversions
# Rates arrive as human-readable strings ("186.97Kb", "1.5Mb", "3.73").
# They are BITS per second: the gateway (gateway-conduit getHumanBitrate) and the
# controller (perfmon.py human_bitrate) format bits/s with x1024 steps and units
# ""|Kb|Mb|Gb|Tb|Pb|Eb. Each one is converted to a float in bits/s, so every
# output gets values in one comparable unit. The raw strings are kept in
# [@metadata][raw_total_*] by filter 94.
filter {
    if "gw_net_stats" in [tags] {
        ruby {
            id => "gw_net_stats-rate-conversion"
            init => '
                @net_rate_fields = ["total_rx_rate", "total_tx_rate", "total_rx_tx_rate"]
                @net_rate_re = /\A([\d.]+)\s*([KMGTPE]?)B?\z/i
                @net_rate_mult = { "" => 1, "K" => 1024, "M" => 1024 ** 2, "G" => 1024 ** 3, "T" => 1024 ** 4,
                                   "P" => 1024 ** 5, "E" => 1024 ** 6 }
            '
            code => '
                @net_rate_fields.each do |f|
                    v = event.get(f)
                    next unless v.is_a?(String)
                    m = @net_rate_re.match(v.strip)
                    next unless m
                    event.set(f, (m[1].to_f * @net_rate_mult[m[2].upcase]).round(2))
                end
            '
        }
    }
}

# Gateway system stats field conversions
filter {
    if "gw_sys_stats" in [tags] {
        mutate {
            id => "gw_sys_stats-field-conversion"
            convert => {
                "cpu_idle" => "float"
                "memory_free" => "integer"
                "memory_available" => "integer"
                "memory_total" => "integer"
                "disk_total" => "integer"
                "disk_free" => "integer"
            }
        }
    }
}
