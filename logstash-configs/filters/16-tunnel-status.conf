# Tunnel Status Change Filter
# Parses AviatrixTunnelStatusChange syslog messages (controller, tunnels/db.py).
#
# Two formats:
#   current (8.0.10+, 8.1.10+, 8.2 and later):
#     AviatrixTunnelStatusChange: Gateway <reporter> reported Tunnel
#       <a(Vendor region)intf=eth1,b(Vendor region)intf=eth2 > old_state=Up new_state=Down
#     (intf= is optional on either side; states include Deleted on teardown)
#   legacy (8.0.0, 8.1.0 and older):
#     AviatrixTunnelStatusChange: src_gw=a(Vendor region) [src_intf=X ]dst_gw=b(...) [dst_intf=Y ]
#       old_state=Down new_state=Up
# Both fill src_gw/dst_gw/old_state/new_state; the current format also sets
# reporting_gw. The trailing colon in the gate keeps the controller event-bus
# message "AviatrixTunnelStatusChanged:" (different format) out of this filter.

filter {
    if [type] == "syslog" and "AviatrixTunnelStatusChange:" in [message] {
        grok {
            id => "tunnel_status"
            patterns_dir => ["/usr/share/logstash/patterns"]
            add_tag => ["tunnel_status"]
            tag_on_failure => ["_avx_grok_failure_tunnel_status"]
            break_on_match => true
            match => {
                "message" => [
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixTunnelStatusChange: Gateway %{NOTSPACE:reporting_gw} reported Tunnel <%{TUNNEL_GW:src_gw}(?:intf=(?<src_intf>[^,\s>]+))?,%{TUNNEL_GW:dst_gw}(?:intf=(?<dst_intf>[^,\s>]+))? ?> old_state=%{WORD:old_state} new_state=%{WORD:new_state}",
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixTunnelStatusChange:.*src_gw=%{TUNNEL_GW:src_gw}(?: src_intf=%{NOTSPACE:src_intf})?.*dst_gw=%{TUNNEL_GW:dst_gw}(?: dst_intf=%{NOTSPACE:dst_intf})?.*old_state=%{WORD:old_state}.*new_state=%{WORD:new_state}"
                ]
            }
        }
    }
}

# Set gateway (used as the event host by the Splunk/webhook outputs).
# Current format: the reporting gateway (the controller sorts the tunnel
# endpoints by name, so src_gw can be an external peer IP).
# Legacy format: the source gateway name, e.g. oregon-transit(AWS us-west-2) -> oregon-transit.
# Two mutates because mutate runs copy after gsub within one block.
filter {
    if "tunnel_status" in [tags] and [reporting_gw] and ![gateway] {
        mutate {
            id => "tunnel-status-reporting-gateway"
            copy => { "reporting_gw" => "gateway" }
        }
    }
    if "tunnel_status" in [tags] and [src_gw] and ![gateway] {
        mutate {
            id => "tunnel-status-copy-gateway"
            copy => { "src_gw" => "gateway" }
        }
        mutate {
            id => "tunnel-status-gateway-name"
            gsub => [ "gateway", "[(].*$", "" ]
        }
    }
}
