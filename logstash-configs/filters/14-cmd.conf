# Controller CMD/API Filter
# Parses AviatrixCMD (V1) and AviatrixAPI (V2.5) syslog messages

# V1 API format (AviatrixCMD)
filter {
    if [type] == "syslog" and "AviatrixCMD" in [message] {
        grok {
            id => "cmd-v1"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["cmd", "V1Api"]
            tag_on_failure => ["_avx_grok_failure_cmd"]
            match => {
                "message" => [
                    # Format with username at end (reason may be empty)
                    "%{SYSLOG_TIMESTAMP:date}.*Controller-%{IP:controller_ip}.*AviatrixCMD: action=%{WORD:action}, argv=%{DATA:args}, result=%{WORD:result}, reason=%{DATA:reason}, username=%{NOTSPACE:username}",
                    # Format without username (reason may be empty)
                    "%{SYSLOG_TIMESTAMP:date}.*Controller-%{IP:controller_ip}.*AviatrixCMD: action=%{WORD:action}, argv=%{DATA:args}, result=%{WORD:result}, reason=%{DATA:reason}$",
                    # Same two formats from a controller whose hostname is not Controller-<ip>
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixCMD: action=%{WORD:action}, argv=%{DATA:args}, result=%{WORD:result}, reason=%{DATA:reason}, username=%{NOTSPACE:username}",
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixCMD: action=%{WORD:action}, argv=%{DATA:args}, result=%{WORD:result}, reason=%{DATA:reason}$"
                ]
            }
        }
    }
}

# V2.5 API format (AviatrixAPI)
# Runs before the hostname/reason defaults below so V2.5 events get them too.
# The leading fields use DATA (lazy) so a key such as " user=" or
# " resp_status=" inside the JSON in resp_data cannot shift the split;
# only resp_data (the last field) is GREEDYDATA.
#
# Controller format (cloudx-local/logs/audit.py, 7.2+): keys in the order
#   method url host ip user req_data resp_status resp_data
# each followed by a space. url is Flask full_path (ends with "?" when there is
# no query string), host/ip/user can be empty, resp_status has a reason phrase
# ("200 OK"), req_data/resp_data are cut at 512 chars + "..." (not valid JSON).
# The patterns without method/host/ip are kept as fallbacks.
filter {
    if [type] == "syslog" and "AviatrixAPI" in [message] and !("cmd" in [tags]) {
        grok {
            id => "cmd-v2"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["cmd", "V2.5API"]
            tag_on_failure => ["_avx_grok_failure_cmd"]
            match => {
                "message" => [
                    # Full controller format, with and without Controller-<ip> in the header
                    "%{SYSLOG_TIMESTAMP:date}.*Controller-%{IP:controller_ip}.*AviatrixAPI: method=%{WORD:http_method} url=%{DATA:action} host=%{DATA:api_host} ip=%{DATA:client_ip} user=%{DATA:username} req_data=%{DATA:args} resp_status=%{DATA:result} resp_data=%{GREEDYDATA:reason}",
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixAPI: method=%{WORD:http_method} url=%{DATA:action} host=%{DATA:api_host} ip=%{DATA:client_ip} user=%{DATA:username} req_data=%{DATA:args} resp_status=%{DATA:result} resp_data=%{GREEDYDATA:reason}",
                    # Fallbacks without method/host/ip
                    # With controller host (Controller-<ip>) in the syslog header
                    "%{SYSLOG_TIMESTAMP:date}.*Controller-%{IP:controller_ip}.*AviatrixAPI.*url=%{DATA:action} user=%{DATA:username} req_data=%{DATA:args} resp_status=%{DATA:result} resp_data=%{GREEDYDATA:reason}",
                    # Without controller host
                    "%{SYSLOG_TIMESTAMP:date}.*AviatrixAPI.*url=%{DATA:action} user=%{DATA:username} req_data=%{DATA:args} resp_status=%{DATA:result} resp_data=%{GREEDYDATA:reason}"
                ]
            }
        }
    }
}

# V2.5 cleanup: drop the "?" Flask appends to a path with no query string,
# trim the trailing space after resp_data, and drop empty host/ip/user.
filter {
    if "V2.5API" in [tags] {
        mutate {
            id => "cmd-v2-cleanup"
            gsub => [ "action", "\?$", "" ]
            strip => ["reason", "args", "result"]
        }
        if [api_host] == "" { mutate { id => "cmd-v2-empty-host" remove_field => ["api_host"] } }
        if [client_ip] == "" { mutate { id => "cmd-v2-empty-ip" remove_field => ["client_ip"] } }
        if [username] == "" { mutate { id => "cmd-v2-empty-user" remove_field => ["username"] } }
    }
}

# Set gw_hostname for CMD logs (use controller_ip if available)
filter {
    if "cmd" in [tags] and [controller_ip] {
        mutate {
            id => "cmd-set-hostname"
            add_field => { "gw_hostname" => "Controller-%{controller_ip}" }
        }
    }
}

# Set default value for empty reason field in CMD logs
filter {
    if "cmd" in [tags] and (![reason] or [reason] == "") {
        mutate {
            id => "cmd-default-reason"
            replace => { "reason" => "" }
        }
    }
}
