# L4 Microsegmentation (eBPF) Filter
# Parses AviatrixGwMicrosegPacket syslog messages (gateway-conduit/microseg.go).
#
# Formats (fields after ENFORCED, by release):
#   8.2.0 early builds: none
#   8.2 GA - 10.0:      SESSION_ID .. SESSION_DUR
#   10.1+:              SESSION_START=<RFC3339 UTC> SESSION_ID .. SESSION_DUR EGRESS_PATH=<enum>
# Session-cleaner timeout lines (9.0+) have empty SRC_MAC=/DST_MAC=, IP_SZ=0,
# ACT=UNSPECIFIED and POLICY=UNKNOWN; the datapath can log POLICY=? when the
# policy UUID cannot be decoded. Legacy 7.x lines use SPT/DPT/ACTION.
#
# Anything after the known fields lands in microseg_unparsed_suffix and tags
# the event _avx_microseg_unknown_fields: the event is still forwarded, but a
# new gateway field (as happened with SESSION_START in 10.1) is visible instead
# of silently breaking the optional session group.

filter {
    if [type] == "syslog" and "AviatrixGwMicrosegPacket" in [message] {
        grok {
            id => "microseg"
            patterns_dir => ["/usr/share/logstash/patterns"]
            break_on_match => true
            add_tag => ["microseg", "ebpf"]
            tag_on_failure => ["_avx_grok_failure_microseg"]
            match => {
                "message" => [
                    # 8.2+ format: GW-<name>-<ip>-sink with /usr/local/bin/avx-gw-state-sync process.
                    # SESSION_START (10.1+), the SESSION_* block (8.2 GA+) and EGRESS_PATH (10.1+)
                    # are each optional. MACs may be empty (session-cleaner timeout lines).
                    "^<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date} +GW-%{DATA:gw_hostname}-%{IP:gw_ip}%{DATA}AviatrixGwMicrosegPacket: POLICY=%{NOTSPACE:uuid} SRC_MAC=(?:%{MAC:src_mac})? DST_MAC=(?:%{MAC:dst_mac})? IP_SZ=%{NUMBER:ip_size} SRC_IP=%{IP:src_ip} DST_IP=%{IP:dst_ip} PROTO=%{WORD:proto} SRC_PORT=%{NUMBER:src_port} DST_PORT=%{NUMBER:dst_port} DATA=%{NOTSPACE:data_hex} ACT=%{WORD:action} ENFORCED=%{WORD:enforced}(?: SESSION_START=%{NOTSPACE:session_start})?(?: SESSION_ID=%{NUMBER:session_id} SESSION_EVENT=%{NUMBER:session_event} SESSION_END_REASON=%{NUMBER:session_end_reason} SESSION_PKT_CNT=%{NUMBER:session_pkt_cnt} SESSION_BYTE_CNT=%{NUMBER:session_byte_cnt} SESSION_DUR=%{NUMBER:session_dur})?(?: EGRESS_PATH=%{NOTSPACE:egress_path})?(?: +(?<microseg_unparsed_suffix>\S.*?))?\s*$",

                    # Legacy format (SPT/DPT/ACTION)
                    "^<%{NUMBER:syslog_pri}>%{SYSLOG_TIMESTAMP:date} +%{HOSTNAME:gw_hostname} +AviatrixGwMicrosegPacket: SRC_MAC=%{MAC:src_mac} DST_MAC=%{MAC:dst_mac} PROTO=%{WORD:proto} SPT=%{NUMBER:src_port} DPT=%{NUMBER:dst_port} ACTION=%{WORD:action}"
                ]
            }
            remove_field => ["event", "@version", "type", "host"]
        }
    }
}

# Flag trailing fields the pattern does not know (see header)
filter {
    if "microseg" in [tags] and [microseg_unparsed_suffix] {
        mutate {
            id => "microseg-unknown-fields-tag"
            add_tag => ["_avx_microseg_unknown_fields"]
        }
    }
}

# Set default values for fields missing in legacy microseg format
filter {
    if "microseg" in [tags] and ![src_ip] {
        mutate {
            id => "microseg-legacy-defaults"
            add_field => {
                "src_ip" => "unknown"
                "dst_ip" => "unknown"
                "uuid" => "legacy-format"
                "enforced" => "unknown"
            }
        }
    }
}

# Enrich session fields with human-readable text (8.2+ events only)
# Uses PAN-OS naming conventions for session_event and session_end_reason
filter {
    if "microseg" in [tags] and [session_event] {
        ruby {
            id => "microseg-session-enrichment"
            init => "
                # session_end_reason: PAN-OS naming
                @session_end_reason_map = {
                    0 => 'active',
                    1 => 'tcp-fin',
                    2 => 'tcp-rst',
                    3 => 'timeout',
                    4 => 'tcp-rst-from-client',
                    5 => 'tcp-rst-from-server'
                }
            "
            code => "
                # session_event (microseg.bpf.c): 0=Start, 1=End, 2=policy update
                se = event.get('session_event').to_i
                event.set('session_event_type', { 0 => 'Start', 1 => 'End', 2 => 'PolicyUpdate' }.fetch(se, 'Unknown'))

                ser = event.get('session_end_reason')
                if ser
                    event.set('session_end_reason_text', @session_end_reason_map.fetch(ser.to_i, 'unknown'))
                end
            "
        }
    }
}
