name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; jobs that publish request write access themselves.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: Release metadata. A tag containing '-' (v1.3.0-rc1, v2.0.0-beta)
  # is a prerelease: its images do NOT move :latest and its GitHub release is
  # marked prerelease, so releases/latest/download/quickstart.sh is unchanged.
  # ---------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
      tls_image: ${{ steps.meta.outputs.tls_image }}
    steps:
      - name: Compute release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tls_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/siem-connector-tls" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # Job 2: Same gates as PRs: assembled freshness, config test of every
  # output type inside the GHCR image (incl. azure/zabbix), sidecar smoke
  # test, and the E2E sample run.
  # ---------------------------------------------------------------
  config-test:
    uses: ./.github/workflows/config-test.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  # ---------------------------------------------------------------
  # Job 3: Build and push GHCR image
  # ---------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: [meta, config-test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare build context (assembles every output type)
        run: container-build/prepare-context.sh "$RUNNER_TEMP/ghcr-context"

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$GITHUB_REF_NAME"
            if [[ "$PRERELEASE" != "true" ]]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/ghcr-context
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ghcr-image

  # ---------------------------------------------------------------
  # Job 4: Build and push TLS sidecar image
  # ---------------------------------------------------------------
  build-tls-sidecar:
    runs-on: ubuntu-latest
    needs: [meta, config-test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ needs.meta.outputs.tls_image }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$GITHUB_REF_NAME"
            if [[ "$PRERELEASE" != "true" ]]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TLS sidecar
        uses: docker/build-push-action@v6
        with:
          context: tls-sidecar
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  # ---------------------------------------------------------------
  # Job 5: Create GitHub release with quickstart assets.
  # Asset names are part of the install contract:
  #   releases/latest/download/quickstart.sh      (deployments/quickstart-aws/quickstart.sh)
  #   releases/download/<tag>/quickstart-aws.tar.gz
  # ---------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    needs: [meta, build-and-push, build-tls-sidecar]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Package quickstart Terraform
        run: |
          tar -czf quickstart-aws.tar.gz \
            --exclude='quickstart.sh' \
            --exclude='*.tfvars' \
            --exclude='.terraform*' \
            --exclude='terraform.tfstate*' \
            -C deployments quickstart-aws/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            quickstart-aws.tar.gz
            deployments/quickstart-aws/quickstart.sh
