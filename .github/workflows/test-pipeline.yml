name: Test Logstash Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'logstash-configs/**'
      - 'test-tools/sample-logs/**'
      - 'test-tools/ci/**'
      - 'container-build/**'
      - 'tls-sidecar/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'logstash-configs/**'
      - 'test-tools/sample-logs/**'
      - 'test-tools/ci/**'
      - 'container-build/**'
      - 'tls-sidecar/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Assembled-config freshness, Dynatrace union, and a config test of every
  # output type (azure and zabbix included) inside the GHCR image.
  config-test:
    uses: ./.github/workflows/config-test.yml

  # End-to-end: stream the sample logs through the ci-test output.
  e2e:
    uses: ./.github/workflows/e2e.yml
